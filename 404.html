<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Terjadi Kesalahan</title>
    <style>
        :root {
            --primary: #27AE60;
            --primary-dark: #229957;
            --dark: #2C3E50;
            --gray: #7F8C8D;
            --light: #F7F8FA;
            --card: #FFFFFF;
            --radius: 14px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: var(--light);
            color: var(--dark);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 28px;
            box-shadow: 0 4px 16px rgba(44, 62, 80, 0.08);
            text-align: center;
            max-width: 480px;
            width: 100%;
        }

        .error-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 16px;
            background: #FFF5F5;
            border: 2px solid #FED7D7;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .error-icon svg {
            width: 40px;
            height: 40px;
            fill: #C53030;
        }

        h1 {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--dark);
        }

        p {
            color: var(--gray);
            font-size: 0.92rem;
            margin-bottom: 22px;
        }

        .btn-wa {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 28px;
            background: #25D36F;
            color: #fff;
            text-decoration: none;
            border-radius: var(--radius);
            font-weight: 600;
            font-size: 0.95rem;
            transition: background .18s ease, transform .08s ease;
        }

        .btn-wa:hover { background: #128C7E; }

        .btn-wa:active { transform: scale(0.985); }

        .btn-wa svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        @media (max-width: 576px) {
            .card { padding: 22px; }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="error-icon">

                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="12"/>
                <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
        </div>
        <h1>Terjadi Kesalahan</h1>
        <p>Halaman yang Anda cari tidak ada atau Anda tidak memiliki akses.</p>

</body>
</html>
